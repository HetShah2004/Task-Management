{% extends 'base.html' %}

{% block title %}
  Login - Task Management
{% endblock %}

{% block content %}
  <div class="max-w-md mx-auto bg-white p-8 mt-10 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">Login to Your Account</h1>

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="mb-4">
        <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username</label>
        <input type="text" name="username" id="username" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required />
      </div>
      <div class="mb-6">
        <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
        <input type="password" name="password" id="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" required />
      </div>
      <div class="flex items-center justify-between">
        <button class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">Sign In</button>
      </div>
      <div class="flex items-center justify-between mt-4">
        <p class="text-sm text-gray-500">Demo credentials: <br> admin / admin <br> User/User@123 </p>
      </div>
    </form>
  </div>
{% endblock %}
